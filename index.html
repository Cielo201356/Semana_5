<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de tareas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Mi lista de tareas</h1>
  <div class="agregar">
    <input type="text" id="tarea" aria-describedby="tarea-error" placeholder="Nueva tarea">
    <button id="agregar" type="button">Agregar tarea</button>
  </div>
  <span id="tarea-error" class="error" aria-live="polite"></span>
  <ul id="lista"></ul>
</main>
<script src="script.js" defer></script>
</body>
</html>
